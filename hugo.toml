baseURL = 'https://woojar.com/'
title = 'Woojar - Tech & Engineering Blog'
theme = 'signal'
defaultContentLanguage = 'en'
enableEmoji = true
ignoreFiles = ["obsidian-templates/*", ".obsidian/*"]

[languages]
  [languages.en]
    contentDir = 'content/en'
    label = 'English'
    title = 'Woojar - Tech & Engineering Blog'
    weight = 1
    
    [[languages.en.menus.main]]
      name = "Home"
      url = "/"
      weight = 1
      
    [[languages.en.menus.main]]
      name = "Posts"
      url = "/posts/"
      weight = 2
      
    [[languages.en.menus.main]]
      name = "Tags"
      url = "/tags/"
      weight = 3
      
    [[languages.en.menus.main]]
      name = "Categories"
      url = "/categories/"
      weight = 4
      
    [[languages.en.menus.main]]
      name = "Archive"
      url = "/archives/"
      weight = 5
      
    [[languages.en.menus.main]]
      name = "About"
      url = "/about/"
      weight = 6
  [languages.zh]
    contentDir = 'content/zh'
    label = '中文'
    title = 'Woojar - 技术与工程博客'
    weight = 2
    
    [[languages.zh.menus.main]]
      name = "主页"
      url = "/"
      weight = 1
      
    [[languages.zh.menus.main]]
      name = "文章"
      url = "/posts/"
      weight = 2
      
    [[languages.zh.menus.main]]
      name = "标签"
      url = "/tags/"
      weight = 3
      
    [[languages.zh.menus.main]]
      name = "分类"
      url = "/categories/"
      weight = 4
      
    [[languages.zh.menus.main]]
      name = "归档"
      url = "/archives/"
      weight = 5
      
    [[languages.zh.menus.main]]
      name = "关于"
      url = "/about/"
      weight = 6
title = "Woojar - 技术与工程博客"

[outputs]
home = ["HTML", "RSS", "JSON"]

[build]
buildDrafts = false

[params]
author = "Woojar"
description = "Telecom software engineer's tech blog - 20 years in telecom software development"
keywords = ["telecom", "software engineering", "tech", "engineering", "daily life"]
copyright = "© 2026 Woojar"
disableBreadcrumb = false
disableGitInfo = false
disableHugoGeneratorInject = false
logoIcon = "📡"
footerTitle = "Woojar"
footerDescription = "Expert insights and technical knowledge"
footerLicense = "All code samples MIT Licensed."

[params.analytics]
id = ""

[params.share]
enable = true

[params.comments]
enable = true

[params.giscus]
repo = "woojar/woojar.github.io"
repoId = "R_kgDOSfOpug"
category = "General"
categoryId = "DIC_kwDOSfOpus4C9TYF"
mapping = "pathname"
reactionsEnabled = "1"
inputPosition = "bottom"
theme = "preferred_color_scheme"
lang = "en"

[params.authorBio]
enable = true
avatar = ""
bio = "20 years in telecom software development. Sharing technical insights and engineering journey."

[params.newsletter]
enable = false
url = ""

[[params.social]]
name = "GitHub"
url = "https://github.com/woojar"

[menus]
[[menus.main]]
name = "Home"
url = "/"
weight = 1

[[menus.main]]
name = "Posts"
url = "/posts/"
weight = 2

[[menus.main]]
name = "Tags"
url = "/tags/"
weight = 3

[[menus.main]]
name = "Categories"
url = "/categories/"
weight = 4

[[menus.main]]
name = "Archive"
url = "/archives/"
weight = 5

[[menus.main]]
name = "About"
url = "/about/"
weight = 6
