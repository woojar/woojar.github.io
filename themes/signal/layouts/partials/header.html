<header class="site-header">
  <div class="header-container">
    <div class="logo">
      <a href="/" aria-label="{{ .Site.Title }} home">{{ with .Site.Params.logoIcon }}📡 {{ end }}{{ .Site.Title }}</a>
    </div>
    <div class="header-right">
      <!-- Language Switcher -->
      <div class="language-switcher">
        <button class="language-toggle" aria-label="Switch language" title="Switch language">
          {{ if eq .Language.Lang "en" }}中文{{ else }}EN{{ end }}
        </button>
        <ul class="language-menu" role="menu">
          <li role="menuitem">
            <a href="/en/" {{ if eq .Language.Lang "en" }}class="active"{{ end }}>English</a>
          </li>
          <li role="menuitem">
            <a href="/zh/" {{ if eq .Language.Lang "zh" }}class="active"{{ end }}>中文</a>
          </li>
        </ul>
      </div>
      <button class="search-toggle" aria-label="Search" title="Search" onclick="document.getElementById('searchOverlay').classList.add('active'); document.getElementById('searchInput').focus();">🔍</button>
      <button class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <span class="theme-icon">🌙</span>
      </button>
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
    <nav>
      <ul class="nav-menu" role="navigation">
        {{ $site := .Site }}
        {{ range .Site.Menus.main }}
          {{ $currentLang := $site.Language.Lang }}
          <li><a href="/{{ $currentLang }}{{ .URL }}" {{ if eq (printf "/%s%s" $currentLang .URL) $.RelPermalink }}class="active"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
