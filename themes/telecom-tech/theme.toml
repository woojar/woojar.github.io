name = "TelecomTech"
author = "Woojar"
license = "MIT"
min_version = "0.93.0"
description = "Modern technology-focused theme for telecom engineers"

[params]
  # Theme features
  enable_search = true
  enable_reading_progress = true
  enable_back_to_top = true
  enable_dark_mode = true

  # Display options
  recent_posts_count = 5
  show_word_count = true
  show_reading_time = true

  # Social links (can be overridden in site config)
  github = ""
  twitter = ""
  email = ""

[params.features]
  related_posts = true
  post_navigation = true
  code_highlight = true

[params.style]
  primary_color = "#2563eb"
  accent_color = "#10b981"
  border_radius = 8