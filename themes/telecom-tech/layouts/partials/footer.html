<footer class="site-footer">
  <div class="footer-content">
    <div class="footer-section fade-in">
      <h3>{{ .Site.Params.footerTitle.value | default "Woojar" }}</h3>
      <p>{{ .Site.Params.footerDescription.value | default "Expert insights and technical knowledge" }}</p>
    </div>
    <div class="footer-section fade-in">
      <h3>Connect</h3>
      <p>{{ .Site.Params.author }} · <a href="https://github.com/woojar">GitHub</a></p>
    </div>
  </div>
  <div class="footer-bottom fade-in">
    <p>&copy; {{ now.Format "2006" }} {{ .Site.Title }}. All code samples MIT Licensed.</p>
  </div>
</footer>
