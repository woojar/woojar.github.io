{{- /* newsletter.html - Newsletter Signup */ -}}
{{- if and .Site.Params.newsletter.enable .Site.Params.newsletter.url }}
<div class="newsletter" aria-label="Newsletter signup">
  <h3>Subscribe to my newsletter</h3>
  <p>Get notified when I publish new articles. No spam, unsubscribe anytime.</p>
  <form action="{{ .Site.Params.newsletter.url }}" method="post" target="_blank">
    <input type="email" name="email" placeholder="your@email.com" required aria-label="Email address">
    <button type="submit">Subscribe</button>
  </form>
</div>
{{- end }}
