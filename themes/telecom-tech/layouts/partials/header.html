<header class="site-header">
  <div class="header-container">
    <div class="logo">
      <a href="{{ .Site.BaseURL }}">📡 {{ .Site.Title }}</a>
    </div>
    <nav>
      <ul class="nav-menu">
        {{ range .Site.Menus.main }}
          <li><a href="{{ .URL }}" {{ if eq $.RelPermalink .URL }}class="active"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
  </div>
  <div class="header-connectors"></div>
</header>
