<header class="site-header">
  <div class="header-container">
    <div class="logo">
      <a href="{{ .Site.BaseURL }}" aria-label="{{ .Site.Title }} home">📡 {{ .Site.Title }}</a>
    </div>
    <div class="header-right">
      <button class="search-toggle" aria-label="Search" title="Search" onclick="document.getElementById('searchOverlay').classList.add('active'); document.getElementById('searchInput').focus();">🔍</button>
      <button class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <span class="theme-icon">🌙</span>
      </button>
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
    <nav>
      <ul class="nav-menu" role="navigation">
        {{ range .Site.Menus.main }}
          <li><a href="{{ .URL }}" {{ if eq $.RelPermalink .URL }}class="active"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>

<script>
document.querySelector('.nav-toggle').addEventListener('click', function() {
  this.classList.toggle('active');
  document.querySelector('.nav-menu').classList.toggle('active');
  this.setAttribute('aria-expanded', this.classList.contains('active'));
});

const themeToggle = document.querySelector('.theme-toggle');
const themeIcon = themeToggle.querySelector('.theme-icon');

function setDarkTheme() {
  document.documentElement.setAttribute('data-theme', 'dark');
  document.documentElement.style.setProperty('--text', '#e2e8f0');
  document.documentElement.style.setProperty('--text-secondary', '#94a3b8');
  document.documentElement.style.setProperty('--bg', '#0f172a');
  document.documentElement.style.setProperty('--bg-card', '#1e293b');
  document.documentElement.style.setProperty('--bg-header', '#020617');
  document.documentElement.style.setProperty('--bg-footer', '#020617');
  document.documentElement.style.setProperty('--border', '#334155');
  themeIcon.textContent = '☀️';
}

function setLightTheme() {
  document.documentElement.setAttribute('data-theme', 'light');
  document.documentElement.style.setProperty('--text', '#1e293b');
  document.documentElement.style.setProperty('--text-secondary', '#64748b');
  document.documentElement.style.setProperty('--bg', '#f8fafc');
  document.documentElement.style.setProperty('--bg-card', '#ffffff');
  document.documentElement.style.setProperty('--bg-header', '#0f172a');
  document.documentElement.style.setProperty('--bg-footer', '#0f172a');
  document.documentElement.style.setProperty('--border', '#e2e8f0');
  themeIcon.textContent = '🌙';
}

themeToggle.addEventListener('click', () => {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  if (currentTheme === 'dark') {
    setLightTheme();
    localStorage.setItem('theme', 'light');
  } else {
    setDarkTheme();
    localStorage.setItem('theme', 'dark');
  }
});

const savedTheme = localStorage.getItem('theme');
if (savedTheme === 'dark') {
  setDarkTheme();
} else if (savedTheme === 'light') {
  setLightTheme();
} else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
  setDarkTheme();
}
</script>
